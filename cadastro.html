
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="cabecalho">
        <h1>Cadastro</h1>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Página inicial</a></li>
                <li><a href="meus_hobbies_ou_interesses.html">Hobbies</a></li>
                <li><a href="sobre_mim.html">Informações</a></li>
                <li><a href="receitas.html">Receitas</a></li>
                <li><a href="README.md">README.md</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="secao centralizado">
            <img class="imagem-destaque"
                src="https://i.pinimg.com/736x/d8/ee/b4/d8eeb4dbabb849a31682a6d2d6006b0c.jpg"
                alt="100" width="500">

            <form action="cadastro.html" method="POST">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="seu-email@exemplo.com" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>

                <label for="data">Data de nascimento:</label>
                <input type="date" id="data" name="datanascimento" required>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>

                <label>Gênero:</label>
                <div class="grupo-checkbox">
                    <div class="opcao-checkbox">
                        <input type="radio" id="gen1" name="genero" value="Feminino" required>
                        <label for="gen1">Feminino</label>
                    </div>
                    <div class="opcao-checkbox">
                        <input type="radio" id="gen2" name="genero" value="Masculino">
                        <label for="gen2">Masculino</label>
                    </div>
                    <div class="opcao-checkbox">
                        <input type="radio" id="gen3" name="genero" value="Neutro">
                        <label for="gen3">Prefiro não dizer</label>
                    </div>
                </div>

                <label for="interesses">Interesses:</label>
                <input type="text" id="interesses" name="interesses" placeholder="Seus interesses" required>

                <label for="cidade">Cidade:</label>
                <select id="cidade" name="cidade" required>
                    <option value="" disabled selected>Selecione sua cidade</option>
                    <option value="Timoteo">Timóteo</option>
                    <option value="Coronel Fabriciano">Coronel Fabriciano</option>
                    <option value="Ipatinga">Ipatinga</option>
                    <option value="Outra">Outra</option>
                </select>

                <label for="comentario">Comentários adicionais:</label>
                <textarea id="comentario" name="comentario" rows="4" placeholder="Comentários adicionais" required></textarea>

                <div class="botoes">
                    <button type="submit">Cadastrar</button>
                    <button type="reset">Limpar</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>Laura - 2º inf 01 - informática</p>
    </footer>
</body>

</html>
